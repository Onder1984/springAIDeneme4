server:
  port: 8082

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ew-copilot-service

  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
        chat:
          options:
            model: gemini-3.5-flash-lite
            temperature: 0.1

emission:
  service:
    url: ${EMISSION_SERVICE_URL:http://localhost:8081}

logging:
  level:
    root: INFO
    com.c2.ew.copilot: DEBUG
    org.springframework.ai: INFO
