server:
  port: 8081

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ew-emission-service

  datasource:
    url: jdbc:postgresql://localhost:5432/tactical_ew_db_3
    username: ew_admin
    password: ew_secret_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.c2.ew.emission: DEBUG
    org.hibernate.SQL: WARN

tactical:
  streamer:
    enabled: false
    interval-ms: 10000
    batch-size: 2
